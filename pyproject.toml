[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fifa4all"
version = "0.1.0"
description = "Play EA Sports FC with head movement and facial gestures."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["fifa4all*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
